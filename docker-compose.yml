services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverso
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dominios:/etc/nginx/conf.d:ro
      - /var/log/nginx:/var/log/nginx
      - ./certificados:/etc/ssl/certs/cloudflare:ro  # Mapeando a pasta de certificados
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
